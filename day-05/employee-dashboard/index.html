<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Employee Management Dashboard</h1>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-label">Total Employees</span>
                    <span class="stat-value" id="totalEmployees">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Average Salary</span>
                    <span class="stat-value" id="avgSalary">$0</span>
                </div>
            </div>
        </header>

        <!-- Controls Section -->
        <section class="controls">
            <div class="search-filter-group">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search by name, email, or department..." 
                        class="search-input"
                    >
                </div>

                <div class="form-group">
                    <select id="departmentFilter" class="filter-select">
                        <option value="">All Departments</option>
                    </select>
                </div>

                <div class="form-group">
                    <select id="sortSelect" class="filter-select">
                        <option value="name-asc">Sort by Name (A-Z)</option>
                        <option value="name-desc">Sort by Name (Z-A)</option>
                        <option value="salary-asc">Sort by Salary (Low to High)</option>
                        <option value="salary-desc">Sort by Salary (High to Low)</option>
                        <option value="date-asc">Sort by Join Date (Oldest)</option>
                        <option value="date-desc">Sort by Join Date (Newest)</option>
                    </select>
                </div>

                <button class="btn btn-primary" id="addEmployeeBtn">+ Add Employee</button>
            </div>
        </section>

        <!-- Employees Table -->
        <section class="employees-section">
            <table class="employees-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Join Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody">
                    <tr class="empty-state">
                        <td colspan="6">No employees found</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- Employee Details Modal -->
        <div class="modal" id="detailsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Employee Details</h2>
                    <button class="close-btn" id="detailsCloseBtn">&times;</button>
                </div>
                <div class="modal-body" id="detailsBody"></div>
            </div>
        </div>

        <!-- Add/Edit Employee Modal -->
        <div class="modal" id="formModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="formTitle">Add Employee</h2>
                    <button class="close-btn" id="formCloseBtn">&times;</button>
                </div>
                <form id="employeeForm" class="modal-body">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department *</label>
                        <input type="text" id="department" required>
                    </div>

                    <div class="form-group">
                        <label for="position">Position *</label>
                        <input type="text" id="position" required>
                    </div>

                    <div class="form-group">
                        <label for="salary">Salary *</label>
                        <input type="number" id="salary" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="joinDate">Join Date *</label>
                        <input type="date" id="joinDate" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Employee</button>
                        <button type="button" class="btn btn-secondary" id="formCancelBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div class="modal" id="deleteModal">
            <div class="modal-content modal-sm">
                <div class="modal-header">
                    <h2>Confirm Delete</h2>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this employee?</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="deleteCancelBtn">Cancel</button>
                    <button class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
